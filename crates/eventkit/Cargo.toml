[package]
name        = "highlandcows-eventkit"
version = "0.5.6"
edition     = "2021"
description = "Rust wrapper for Apple's EventKit — CRUD access to macOS Reminders and Calendar"
license     = "MIT"
repository  = "https://github.com/njacobs5074/highlandcows"
homepage    = "https://github.com/njacobs5074/highlandcows"
readme      = "README.md"
keywords    = ["eventkit", "reminders", "calendar", "macos", "apple"]
categories  = ["os::macos-apis"]

[lib]
name = "highlandcows_eventkit"

[target.'cfg(target_os = "macos")'.dependencies]
objc2            = "0.6.4"
objc2-event-kit  = { version = "0.3.2", features = [
    "EKEventStore",
    "EKEvent",
    "EKReminder",
    "EKCalendar",
    "EKCalendarItem",
    "EKObject",
    "EKTypes",
    "EKError",
    "EKSource",
] }
objc2-foundation = { version = "0.3.2", features = [
    "NSArray",
    "NSCalendar",
    "NSDate",
    "NSError",
    "NSPredicate",
    "NSString",
    "NSTimeZone",
    "NSURL",
] }
block2    = "0.6.2"
thiserror = "2"
chrono    = { version = "0.4", features = ["std"], default-features = false }

[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
tokio = { version = "1", features = ["sync"], optional = true }
