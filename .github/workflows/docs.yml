name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual trigger from the Actions tab

# Required for the deploy-pages action to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; don't cancel in-flight deployments.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable

      - name: Build documentation
        run: cargo doc --no-deps --workspace

      # GitHub Pages won't serve a directory listing, so add a root
      # index.html that redirects straight to the main crate's docs.
      - name: Add root redirect
        run: |
          echo '<meta http-equiv="refresh" content="0; url=highlandcows_isam">' \
            > target/doc/index.html

      - uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d  # v4

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
